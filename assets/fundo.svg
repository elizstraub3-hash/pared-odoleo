<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1528" viewBox="0 0 1080 1528" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a0306"/>
      <stop offset="55%" stop-color="#0c0102"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="spk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="45%" stop-color="#5c0207"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1080" height="1528" fill="url(#bg)"/>

  <!-- grunge / splatter streaks -->
  <g fill="#e50914" opacity="0.10">
    <path d="M-40 300 L500 240 L520 300 L-20 360 Z"/>
    <path d="M600 700 L1120 640 L1140 700 L620 760 Z"/>
    <path d="M-40 1050 L620 980 L640 1040 L-20 1110 Z"/>
    <circle cx="200" cy="60" r="90"/>
    <circle cx="950" cy="500" r="120"/>
    <circle cx="120" cy="900" r="80"/>
    <circle cx="880" cy="1250" r="110"/>
  </g>

  <!-- speakers / subwoofers -->
  <g opacity="0.5">
    <g transform="translate(80,540)">
      <circle r="120" fill="url(#spk)"/><circle r="120" fill="none" stroke="#000" stroke-width="10"/>
      <circle r="45" fill="#111"/><circle r="18" fill="#e50914"/>
    </g>
    <g transform="translate(1000,220)">
      <circle r="140" fill="url(#spk)"/><circle r="140" fill="none" stroke="#000" stroke-width="12"/>
      <circle r="52" fill="#111"/><circle r="20" fill="#e50914"/>
    </g>
    <g transform="translate(960,1120)">
      <circle r="130" fill="url(#spk)"/><circle r="130" fill="none" stroke="#000" stroke-width="10"/>
      <circle r="48" fill="#111"/><circle r="19" fill="#e50914"/>
    </g>
    <g transform="translate(120,1330)">
      <circle r="110" fill="url(#spk)"/><circle r="110" fill="none" stroke="#000" stroke-width="10"/>
      <circle r="42" fill="#111"/><circle r="16" fill="#e50914"/>
    </g>
  </g>

  <!-- lightning bolts -->
  <g fill="#ff2130" filter="url(#glow)" opacity="0.85">
    <path d="M470 40 L430 200 L480 190 L420 380 L560 150 L500 165 Z"/>
    <path d="M770 260 L740 380 L780 372 L735 520 L840 340 L795 352 Z"/>
    <path d="M150 1060 L120 1180 L160 1172 L118 1310 L225 1140 L180 1152 Z"/>
    <path d="M470 1060 L448 1150 L478 1144 L446 1250 L520 1120 L486 1130 Z"/>
  </g>

  <!-- equalizer bars -->
  <g fill="#e50914" opacity="0.35">
    <rect x="470" y="470" width="18" height="60"/>
    <rect x="494" y="440" width="18" height="90"/>
    <rect x="518" y="410" width="18" height="120"/>
    <rect x="542" y="450" width="18" height="80"/>
    <rect x="566" y="420" width="18" height="110"/>
    <rect x="40" y="1200" width="16" height="50"/>
    <rect x="60" y="1170" width="16" height="80"/>
    <rect x="80" y="1140" width="16" height="110"/>
    <rect x="100" y="1180" width="16" height="70"/>
  </g>

  <!-- music notes -->
  <g fill="#ff2130" opacity="0.5">
    <g transform="translate(640,210)">
      <ellipse cx="0" cy="34" rx="16" ry="12"/><rect x="13" y="-30" width="6" height="64"/>
      <path d="M19 -30 q34 8 30 46 q-4 -30 -30 -30 Z"/>
    </g>
    <g transform="translate(230,380) scale(0.8)">
      <ellipse cx="0" cy="34" rx="16" ry="12"/><rect x="13" y="-30" width="6" height="64"/>
      <ellipse cx="70" cy="24" rx="16" ry="12"/><rect x="83" y="-40" width="6" height="64"/>
      <rect x="13" y="-40" width="76" height="8"/>
    </g>
    <g transform="translate(760,1360) scale(0.9)">
      <ellipse cx="0" cy="34" rx="16" ry="12"/><rect x="13" y="-30" width="6" height="64"/>
      <path d="M19 -30 q34 8 30 46 q-4 -30 -30 -30 Z"/>
    </g>
  </g>
</svg>
